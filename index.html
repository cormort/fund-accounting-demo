<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基金會計雲 Demo</title><link rel="stylesheet" href="app.css"></head><body>
<div class="app"><aside><div class="brand">🧾 <span>基金會計雲<small>Fund Accounting Demo</small></span></div><nav id="nav"></nav><div class="rule">✓ EAS 科目、借貸平衡、預算額度與關帳期間檢核</div></aside><main><header><div><h1 id="title">總覽</h1><small>民國115年度｜作業基金｜展示環境</small></div><button class="secondary" onclick="resetData()">重設資料</button></header><section class="filters"><select id="gov"><option value="">全部政府別</option><option>中央</option><option>地方</option></select><select id="fund"><option value="">全部基金</option></select><span id="clock"></span></section><div id="view"></div></main></div>
<div id="modal" class="modal hidden"><form id="journalForm" class="dialog"><button type="button" class="close" onclick="closeModal()">×</button><h2>新增平衡傳票</h2><label>實績單位<select id="unit" required></select></label><label>傳票日期<input id="vdate" type="date" required></label><label>摘要<input id="summary" required value="設備維護服務費"></label><div class="grid2"><label>借方科目<select id="debitAccount"></select></label><label>貸方科目<select id="creditAccount"></select></label></div><label>金額<input id="amount" type="number" min="1" value="128000" required></label><button class="primary">儲存草稿</button></form></div>
<div id="toast"></div><script src="app.js"></script></body></html>
